[package]
name = "m8s-plugin"
version = "0.1.0"
edition = "2024"
description = "Mesh plugin exposing the m8s compute controller"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "2809443345ea8134db62a8b433f5bb2bb5f1d123" }
m8s-cli = { path = "../crates/m8s-cli" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

serde = { version = "1", features = ["derive"] }
libc = "0.2"
fs2 = "0.4"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

schemars = "1"

[dev-dependencies]
tempfile = "3"
