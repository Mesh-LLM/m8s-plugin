[package]
name = "m8s-plugin"
version = "0.1.0"
edition = "2024"
description = "Mesh plugin exposing the m8s compute controller"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "f2a7f62c755e283c389a28cbf8d1e8f926677a4e" }
m8s-cli = { path = "../crates/m8s-cli" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
