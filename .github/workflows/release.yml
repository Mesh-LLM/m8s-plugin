name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: m8s-plugin
            plugin_binary: m8s
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            package: tar
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            binary: m8s-plugin
            plugin_binary: m8s
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            package: tar
          - name: macos-aarch64
            os: macos-15
            binary: m8s-plugin
            plugin_binary: m8s
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            package: tar
          - name: windows-x86_64
            os: windows-latest
            binary: m8s-plugin.exe
            plugin_binary: m8s.exe
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            package: zip
          - name: windows-aarch64
            os: windows-11-arm
            binary: m8s-plugin.exe
            plugin_binary: m8s.exe
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            package: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --manifest-path plugin/Cargo.toml --release --locked

      - name: Test release binary
        run: cargo test --manifest-path plugin/Cargo.toml --release --locked

      - name: Package Unix archive
        if: matrix.package == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          stable_archive="m8s-${{ matrix.target }}.${{ matrix.archive_ext }}"
          versioned_archive="m8s-${version}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          mkdir -p dist/m8s
          cp "plugin/target/release/${{ matrix.binary }}" "dist/m8s/${{ matrix.plugin_binary }}"
          cp plugin/plugin.toml dist/m8s/plugin.toml
          cp plugin/README.md dist/m8s/README.md
          "plugin/target/release/${{ matrix.binary }}" --print-package-manifest > dist/m8s/plugin-manifest.json
          tar -czf "$stable_archive" -C dist m8s
          cp "$stable_archive" "$versioned_archive"

      - name: Package Windows archive
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}".TrimStart("v")
          $stableArchive = "m8s-${{ matrix.target }}.${{ matrix.archive_ext }}"
          $versionedArchive = "m8s-$version-${{ matrix.target }}.${{ matrix.archive_ext }}"
          New-Item -ItemType Directory -Force -Path dist/m8s | Out-Null
          Copy-Item "plugin/target/release/${{ matrix.binary }}" "dist/m8s/${{ matrix.plugin_binary }}"
          Copy-Item plugin/plugin.toml "dist/m8s/plugin.toml"
          Copy-Item plugin/README.md "dist/m8s/README.md"
          & "plugin/target/release/${{ matrix.binary }}" --print-package-manifest > "dist/m8s/plugin-manifest.json"
          Compress-Archive -Path "dist/m8s" -DestinationPath $stableArchive
          Copy-Item $stableArchive $versionedArchive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: m8s-${{ matrix.target }}
          path: |
            m8s-*.tar.gz
            m8s-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
